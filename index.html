<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دعوة خطوبة أحمد و زينب</title>

<!-- WhatsApp / Social Preview -->
<meta property="og:title" content="دعوة خطوبة أحمد و زينب 🌿" />
<meta property="og:description" content="الاثنين 15 يونيو 2026 - الساعة 8 مساءً - Diarb Negm, LE Plaza Hall" />
<meta property="og:image" content="preview.jpg" />
<meta property="og:type" content="website" />

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f7f2e8;
    --green:#5c6f52;
    --green-deep:#3f4f38;
    --gold:#c9a35d;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Tajawal', sans-serif;
    background:linear-gradient(180deg, #faf6ef, #f1ead9);
    color:var(--green-deep);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .card{
    background:#fffdf8;
    border-radius:20px;
    max-width:480px;
    width:100%;
    padding:42px 30px 36px;
    text-align:center;
    box-shadow:0 18px 50px rgba(63,79,56,0.10);
    position:relative;
    overflow:hidden;
    animation:fadeUp .9s ease both;
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
  }

  .flower-top, .flower-bottom{
    position:absolute;
    width:130px;
    opacity:.95;
  }
  .flower-top{ top:-30px; right:-30px; }
  .flower-bottom{ bottom:-30px; left:-30px; transform:rotate(180deg); }

  .bismillah{
    font-size:14px;
    color:var(--gold);
    letter-spacing:2px;
    margin-bottom:14px;
    font-weight:500;
    position:relative;
    z-index:1;
  }
  .invite-text{
    font-size:14px;
    color:var(--green);
    line-height:1.9;
    margin-bottom:4px;
    position:relative;
    z-index:1;
  }
  .names{
    font-family:'Great Vibes', cursive;
    direction:ltr;
    font-size:50px;
    color:var(--green-deep);
    margin:14px 0 0;
    line-height:1.3;
    position:relative;
    z-index:1;
  }
  .amp{
    font-size:22px;
    color:var(--gold);
    margin:4px 0;
    position:relative;
    z-index:1;
  }
  .divider{
    width:50px;
    height:1px;
    background:var(--gold);
    margin:20px auto;
    opacity:.6;
    position:relative;
    z-index:1;
  }
  .date-num{
    font-size:50px;
    font-weight:700;
    color:var(--green);
    line-height:1;
    position:relative;
    z-index:1;
  }
  .date-meta{
    font-size:13px;
    letter-spacing:2px;
    color:var(--green-deep);
    text-transform:uppercase;
    margin-top:4px;
    position:relative;
    z-index:1;
  }
  .location{
    margin-top:18px;
    font-size:15px;
    font-weight:700;
    color:var(--green-deep);
    position:relative;
    z-index:1;
  }
  .reception{
    font-family:'Great Vibes', cursive;
    font-size:22px;
    color:var(--green);
    margin-top:6px;
    direction:ltr;
    position:relative;
    z-index:1;
  }
  .map-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:24px;
    padding:12px 28px;
    background:var(--green);
    color:#fffdf8;
    text-decoration:none;
    border-radius:30px;
    font-size:14px;
    font-weight:500;
    transition:background .25s, transform .25s;
    position:relative;
    z-index:1;
  }
  .map-btn:hover{
    background:var(--green-deep);
    transform:translateY(-2px);
  }
</style>
</head>
<body>
  <div class="card">

    <!-- Floral decorations -->
    <svg class="flower-top" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <g opacity="0.9">
        <ellipse cx="120" cy="60" rx="35" ry="22" fill="#f3ece0" stroke="#e3d8c4" stroke-width="1" transform="rotate(20 120 60)"/>
        <ellipse cx="150" cy="40" rx="32" ry="20" fill="#f7f1e7" stroke="#e3d8c4" stroke-width="1" transform="rotate(-10 150 40)"/>
        <ellipse cx="160" cy="80" rx="30" ry="20" fill="#f3ece0" stroke="#e3d8c4" stroke-width="1" transform="rotate(50 160 80)"/>
        <ellipse cx="130" cy="95" rx="28" ry="18" fill="#f7f1e7" stroke="#e3d8c4" stroke-width="1" transform="rotate(-30 130 95)"/>
        <circle cx="140" cy="65" r="10" fill="#d8b87a"/>
        <path d="M40 180 C 70 150, 90 120, 150 70" stroke="#8aa07a" stroke-width="3" fill="none" opacity="0.6"/>
        <ellipse cx="70" cy="150" rx="22" ry="9" fill="#9cb389" opacity="0.7" transform="rotate(-40 70 150)"/>
        <ellipse cx="100" cy="115" rx="20" ry="8" fill="#9cb389" opacity="0.7" transform="rotate(-35 100 115)"/>
      </g>
    </svg>

    <svg class="flower-bottom" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <g opacity="0.9">
        <ellipse cx="120" cy="60" rx="35" ry="22" fill="#f3ece0" stroke="#e3d8c4" stroke-width="1" transform="rotate(20 120 60)"/>
        <ellipse cx="150" cy="40" rx="32" ry="20" fill="#f7f1e7" stroke="#e3d8c4" stroke-width="1" transform="rotate(-10 150 40)"/>
        <ellipse cx="160" cy="80" rx="30" ry="20" fill="#f3ece0" stroke="#e3d8c4" stroke-width="1" transform="rotate(50 160 80)"/>
        <ellipse cx="130" cy="95" rx="28" ry="18" fill="#f7f1e7" stroke="#e3d8c4" stroke-width="1" transform="rotate(-30 130 95)"/>
        <circle cx="140" cy="65" r="10" fill="#d8b87a"/>
        <path d="M40 180 C 70 150, 90 120, 150 70" stroke="#8aa07a" stroke-width="3" fill="none" opacity="0.6"/>
        <ellipse cx="70" cy="150" rx="22" ry="9" fill="#9cb389" opacity="0.7" transform="rotate(-40 70 150)"/>
        <ellipse cx="100" cy="115" rx="20" ry="8" fill="#9cb389" opacity="0.7" transform="rotate(-35 100 115)"/>
      </g>
    </svg>

    <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>

    <div class="invite-text">أنتم مدعوون لحضور حفل خطوبة</div>

    <div class="names">Ahmed</div>
    <div class="amp">&amp;</div>
    <div class="names">Zainab</div>

    <div class="divider"></div>

    <div class="date-num">15</div>
    <div class="date-meta">Monday • June 2026 • 08:00 PM</div>

    <div class="location">Diarb Negm , LE Plaza Hall</div>
    <div class="reception">Reception to follow</div>

    <a class="map-btn" href="https://maps.app.goo.gl/xneJZV6PwufHAmxP9" target="_blank" rel="noopener">
      📍 افتح الموقع على الخريطة
    </a>

  </div>
</body>
</html>
