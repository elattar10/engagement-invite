<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دعوة خطوبة أحمد و زينب</title>
<meta property="og:title" content="دعوة خطوبة أحمد و زينب 🌿" />
<meta property="og:description" content="الاثنين 15 يونيو 2026 - الساعة 8 مساءً - Diarb Negm, LE Plaza Hall" />
<meta property="og:type" content="website" />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@1&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #f7f2e8;
  --green: #5c6f52;
  --green-deep: #3f4f38;
  --gold: #c9a35d;
  --gold-light: #e2c07a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Tajawal', sans-serif;
  background: linear-gradient(160deg, #faf6ef, #f1ead9, #ede4d4);
  color: var(--green-deep);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ══════════════════════════════════════
   CURTAIN SCREEN
══════════════════════════════════════ */
#curtain-screen {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at center, #2e3e28 0%, #1a2616 100%);
  overflow: hidden;
}

.wave-top, .wave-bottom {
  position: absolute;
  left: 0; right: 0;
  height: 80px;
  z-index: 4;
  pointer-events: none;
}
.wave-top { top: 0; }
.wave-bottom { bottom: 0; transform: rotate(180deg); }

.curtain-left, .curtain-right {
  position: absolute;
  top: 0; bottom: 0;
  width: 51%;
  z-index: 2;
  overflow: hidden;
  transition: transform 1.8s cubic-bezier(0.77, 0, 0.18, 1);
}
.curtain-left  { left: 0; }
.curtain-right { right: 0; }

.curtain-left svg.curtain-shape,
.curtain-right svg.curtain-shape {
  position: absolute;
  top: 0; left: 0; right: 0;
  width: 100%; height: 100%;
}

#curtain-screen.open .curtain-left  { transform: translateX(-100%); }
#curtain-screen.open .curtain-right { transform: translateX(100%); }
#curtain-screen.gone {
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.5s ease 1.6s;
}

.pelmet {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 52px;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(90deg, #1a2616, #3a5230, #1a2616);
  border-bottom: 3px solid var(--gold);
  overflow: hidden;
}
.pelmet-swag {
  position: absolute;
  bottom: -2px;
  display: flex;
  gap: 0;
}
.pelmet-swag-arc {
  width: 48px;
  height: 22px;
  border-radius: 0 0 50% 50%;
  border: 3px solid var(--gold);
  border-top: none;
  background: transparent;
  margin: 0 -1px;
}

.curtain-center {
  position: relative;
  z-index: 6;
  text-align: center;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  animation: fadeUp 0.9s ease 0.4s both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.ornament {
  color: var(--gold-light);
  font-size: 22px;
  letter-spacing: 6px;
  opacity: 0.85;
  margin: 6px 0;
  font-family: serif;
}

.curtain-welcome {
  font-family: 'Tajawal', sans-serif;
  font-size: 13px;
  color: rgba(226, 192, 122, 0.75);
  letter-spacing: 3px;
  font-weight: 300;
  margin-bottom: 6px;
}

.curtain-guest-name {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: clamp(34px, 8vw, 62px);
  color: #f5ecd6;
  text-shadow: 0 0 50px rgba(201,163,93,0.6), 0 2px 10px rgba(0,0,0,0.6);
  line-height: 1.2;
  min-height: 1.3em;
}

.curtain-card {
  margin-top: 20px;
  border: 1.5px solid rgba(201,163,93,0.45);
  border-radius: 16px;
  padding: 18px 28px;
  background: rgba(255,253,248,0.06);
  backdrop-filter: blur(4px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  max-width: 310px;
  width: 90vw;
  position: relative;
}
.curtain-card::before, .curtain-card::after {
  content: '✦';
  position: absolute;
  color: var(--gold);
  font-size: 14px;
  opacity: 0.6;
}
.curtain-card::before { top: 8px; right: 10px; }
.curtain-card::after  { bottom: 8px; left: 10px; }

.curtain-card-label {
  font-size: 11px;
  letter-spacing: 3px;
  color: rgba(201,163,93,0.7);
  text-transform: uppercase;
  font-family: 'Tajawal';
}
.curtain-card-date {
  font-family: 'EB Garamond', serif;
  font-size: 18px;
  color: #f0e6d0;
  direction: ltr;
  font-style: italic;
}
.curtain-card-venue {
  font-size: 13px;
  color: rgba(240,230,208,0.8);
  font-family: 'Tajawal';
}

.open-btn {
  margin-top: 22px;
  padding: 13px 32px;
  background: transparent;
  border: 2px solid var(--gold);
  border-radius: 30px;
  color: var(--gold-light);
  font-family: 'Tajawal', sans-serif;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: 1px;
  cursor: pointer;
  transition: background 0.25s, color 0.25s, transform 0.2s;
  animation: pulseBorder 2.5s ease-in-out infinite;
  position: relative;
  z-index: 6;
}
.open-btn:hover {
  background: var(--gold);
  color: #1a2616;
  transform: scale(1.04);
  animation: none;
}
@keyframes pulseBorder {
  0%, 100% { box-shadow: 0 0 0 0 rgba(201,163,93,0.4); }
  50%       { box-shadow: 0 0 0 8px rgba(201,163,93,0); }
}

.stage-light {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 50% 60% at center, rgba(255,240,200,0.1) 0%, transparent 65%);
  z-index: 1;
  pointer-events: none;
}

.star {
  position: absolute;
  border-radius: 50%;
  background: var(--gold-light);
  opacity: 0;
  animation: twinkle var(--d, 3s) ease-in-out var(--delay, 0s) infinite;
}
@keyframes twinkle {
  0%, 100% { opacity: 0; transform: scale(0.8); }
  50%       { opacity: 0.6; transform: scale(1.2); }
}

/* ══════════════════════════════════════
   MAIN CARD
══════════════════════════════════════ */
#main-card {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px 16px 40px;
  opacity: 0;
  transition: opacity 0.8s ease;
}
#main-card.visible { opacity: 1; }

.card {
  background: #fffdf8;
  border-radius: 24px;
  max-width: 500px;
  width: 100%;
  padding: 44px 30px 38px;
  text-align: center;
  box-shadow: 0 24px 60px rgba(63,79,56,0.12);
  position: relative;
  overflow: hidden;
}

/* Arabesque background pattern */
.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(circle at 25% 25%, rgba(201,163,93,0.04) 0%, transparent 50%),
    radial-gradient(circle at 75% 75%, rgba(92,111,82,0.04) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

.flower-top, .flower-bottom {
  position: absolute;
  width: 140px;
  opacity: 0.92;
  pointer-events: none;
}
.flower-top    { top: -34px; right: -34px; }
.flower-bottom { bottom: -34px; left: -34px; transform: rotate(180deg); }

/* ══════════════════════════════════════
   SPARKLE NAME ANIMATION
══════════════════════════════════════ */
@keyframes shimmer {
  0%   { background-position: -200% center; }
  100% { background-position: 200% center; }
}
.names-shimmer {
  background: linear-gradient(90deg,
    var(--green-deep) 0%, var(--green-deep) 30%,
    var(--gold) 45%,
    #fff8e7 50%,
    var(--gold) 55%,
    var(--green-deep) 70%, var(--green-deep) 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: shimmer 3s linear infinite;
}

/* Floating sparkles around names */
.sparkle-wrap {
  position: relative;
  display: inline-block;
}
.sparkle {
  position: absolute;
  pointer-events: none;
  animation: sparklePop var(--dur, 2s) ease-in-out var(--delay, 0s) infinite;
  font-size: var(--sz, 14px);
  color: var(--gold);
  opacity: 0;
  z-index: 2;
}
@keyframes sparklePop {
  0%   { opacity: 0; transform: scale(0) rotate(0deg) translate(0,0); }
  30%  { opacity: 1; transform: scale(1.2) rotate(20deg) translate(var(--tx,0), var(--ty,0)); }
  70%  { opacity: 0.8; transform: scale(1) rotate(-10deg) translate(var(--tx,0), var(--ty,0)); }
  100% { opacity: 0; transform: scale(0) rotate(30deg) translate(var(--tx,0), var(--ty,0)); }
}

/* Glowing halo behind name block */
.name-glow {
  position: relative;
}
.name-glow::after {
  content: '';
  position: absolute;
  inset: -10px -30px;
  background: radial-gradient(ellipse, rgba(201,163,93,0.12) 0%, transparent 70%);
  z-index: 0;
  pointer-events: none;
  animation: pulseGlow 3s ease-in-out infinite;
}
@keyframes pulseGlow {
  0%, 100% { opacity: 0.6; }
  50%       { opacity: 1; }
}

/* ══════════════════════════════════════
   FAMILIES BOX — REDESIGNED
══════════════════════════════════════ */
.families-box {
  position: relative;
  margin: 4px 0 8px;
  z-index: 1;
}

/* Outer decorative border with corner ornaments */
.families-outer {
  position: relative;
  border: 2px solid var(--gold);
  border-radius: 18px;
  padding: 3px;
  background: linear-gradient(135deg, rgba(201,163,93,0.08), rgba(255,253,248,0.5), rgba(201,163,93,0.08));
}

/* Animated shimmer border */
.families-outer::before {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 20px;
  background: conic-gradient(from 0deg, transparent 0%, var(--gold-light) 20%, transparent 40%, var(--gold) 60%, transparent 80%, var(--gold-light) 100%);
  z-index: -1;
  animation: rotateBorder 6s linear infinite;
  opacity: 0.5;
}
@keyframes rotateBorder {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

.families-inner {
  border: 1px solid rgba(201,163,93,0.3);
  border-radius: 15px;
  padding: 20px 18px 18px;
  background: rgba(255,253,248,0.9);
  position: relative;
  overflow: hidden;
}

/* Corner ornaments */
.families-inner .fam-corner {
  position: absolute;
  font-size: 22px;
  color: var(--gold);
  opacity: 0.7;
  line-height: 1;
  font-family: serif;
}
.fam-corner.tl { top: 6px; right: 8px; }
.fam-corner.tr { top: 6px; left: 8px; }
.fam-corner.bl { bottom: 6px; right: 8px; }
.fam-corner.br { bottom: 6px; left: 8px; }

/* Arabesque watermark in center */
.families-inner::before {
  content: '❋';
  position: absolute;
  font-size: 100px;
  color: var(--gold);
  opacity: 0.04;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  font-family: serif;
}

.families-header {
  text-align: center;
  margin-bottom: 12px;
}

.families-bismillah-line {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 6px;
}
.families-bismillah-line .fam-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity: 0.5;
  max-width: 50px;
}
.families-bismillah-icon {
  font-size: 20px;
  color: var(--gold);
  opacity: 0.8;
}

.families-invite-label {
  font-size: 10px;
  letter-spacing: 3px;
  color: rgba(92,111,82,0.55);
  margin-bottom: 4px;
  font-weight: 500;
}

.families-invite-text {
  font-size: 15px;
  color: var(--green-deep);
  line-height: 1.85;
  font-weight: 500;
}

.families-invite-text .accent {
  color: var(--gold);
  font-size: 13px;
  letter-spacing: 1px;
  display: block;
  margin-top: 2px;
}

/* Divider between text and family names */
.families-divider {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 12px 0;
}
.families-divider-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity: 0.4;
}
.families-divider-center {
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--gold);
  font-size: 12px;
  opacity: 0.75;
}

/* Family names row */
.families-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}

.family-block {
  text-align: center;
  position: relative;
}

.family-tag {
  font-size: 10px;
  color: var(--gold);
  letter-spacing: 2px;
  opacity: 0.75;
  margin-bottom: 3px;
  font-weight: 500;
}

.family-name {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 26px;
  color: var(--green-deep);
  font-weight: 700;
  text-shadow: 0 1px 4px rgba(201,163,93,0.15);
  position: relative;
}

/* Underline shimmer on family names */
.family-name::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 10%;
  right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity: 0.6;
}

.family-sep {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  color: var(--gold);
  opacity: 0.7;
  font-size: 11px;
  padding: 0 4px;
}

/* Bottom blessing */
.families-blessing {
  text-align: center;
  margin-top: 12px;
  font-size: 12px;
  color: var(--green);
  opacity: 0.8;
  font-style: italic;
  letter-spacing: 0.5px;
}

/* ══════════════════════════════════════
   INVITE ORNAMENT
══════════════════════════════════════ */
.bismillah {
  font-size: 14px;
  color: var(--gold);
  letter-spacing: 2px;
  margin-bottom: 10px;
  font-weight: 500;
  position: relative; z-index: 1;
}

.invite-ornament {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 8px 0 2px;
  position: relative; z-index: 1;
}
.invite-ornament-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  max-width: 60px;
  opacity: 0.5;
}
.invite-ornament-dot {
  width: 5px; height: 5px;
  background: var(--gold);
  border-radius: 50%;
  opacity: 0.7;
}

.card-guest-label {
  font-size: 11px;
  color: var(--gold);
  letter-spacing: 3px;
  margin-top: 12px;
  margin-bottom: 2px;
  position: relative; z-index: 1;
}
.card-guest-name {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 26px;
  color: var(--green-deep);
  position: relative; z-index: 1;
  margin-bottom: 4px;
}

.names {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  direction: ltr;
  font-size: 42px;
  line-height: 1.3;
  position: relative; z-index: 1;
}
.amp { font-size: 22px; color: var(--gold); margin: 4px 0; position: relative; z-index: 1; }
.name-cap { font-size: 1.4em; }

.divider {
  width: 50px; height: 1px;
  background: var(--gold);
  margin: 20px auto;
  opacity: .6;
  position: relative; z-index: 1;
}

/* ══════════════════════════════════════
   COUNTDOWN
══════════════════════════════════════ */
.countdown-wrap {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin: 16px 0 4px;
  position: relative; z-index: 1;
}
.countdown-unit { display: flex; flex-direction: column; align-items: center; }
.countdown-num {
  font-size: 32px; font-weight: 700;
  color: var(--green); line-height: 1;
  min-width: 44px; text-align: center;
}
.countdown-label {
  font-size: 10px; letter-spacing: 1.5px;
  color: var(--green); opacity: 0.7;
  margin-top: 3px; text-transform: uppercase;
}
.countdown-sep { font-size: 28px; color: var(--gold); line-height: 1; margin-top: 2px; opacity: 0.6; }

/* ══════════════════════════════════════
   CELEBRATION MESSAGE (instead of countdown)
══════════════════════════════════════ */
.celebration-wrap {
  position: relative; z-index: 1;
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 20px 16px;
  margin: 10px 0;
  animation: celebFadeIn 1s ease both;
}
@keyframes celebFadeIn {
  from { opacity: 0; transform: scale(0.9); }
  to   { opacity: 1; transform: scale(1); }
}
.celebration-wrap.show { display: flex; }

.celeb-ring {
  width: 90px; height: 90px;
  border-radius: 50%;
  border: 3px solid var(--gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
  position: relative;
  animation: ringPulse 2s ease-in-out infinite;
  background: radial-gradient(circle, rgba(201,163,93,0.08), transparent);
}
@keyframes ringPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(201,163,93,0.4), 0 0 0 6px rgba(201,163,93,0.1); }
  50%       { box-shadow: 0 0 0 10px rgba(201,163,93,0), 0 0 0 20px rgba(201,163,93,0); }
}

.celeb-title {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 26px;
  color: var(--green-deep);
  text-align: center;
}

.celeb-subtitle {
  font-size: 14px;
  color: var(--green);
  letter-spacing: 1px;
  opacity: 0.85;
  text-align: center;
}

.celeb-dua {
  font-size: 13px;
  color: var(--gold);
  letter-spacing: 0.5px;
  opacity: 0.9;
  text-align: center;
  font-style: italic;
  margin-top: 4px;
  padding: 8px 16px;
  border: 1px solid rgba(201,163,93,0.3);
  border-radius: 20px;
  background: rgba(201,163,93,0.05);
}

/* Floating rings animation */
.celeb-rings {
  display: flex;
  gap: 4px;
  margin-top: 4px;
  position: relative;
}
.ring-icon {
  font-size: 22px;
  animation: swingRing 2s ease-in-out infinite;
}
.ring-icon:nth-child(2) { animation-delay: 0.3s; }
@keyframes swingRing {
  0%, 100% { transform: rotate(-8deg); }
  50%       { transform: rotate(8deg); }
}

/* ══════════════════════════════════════
   ACTION BUTTONS (Share + Calendar)
══════════════════════════════════════ */
.action-buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 16px;
  position: relative; z-index: 1;
}

.map-btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; padding: 12px 22px;
  background: var(--green); color: #fffdf8;
  text-decoration: none; border-radius: 30px;
  font-size: 14px; font-weight: 500;
  transition: background .25s, transform .25s;
}
.map-btn:hover { background: var(--green-deep); transform: translateY(-2px); }

.calendar-btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; padding: 12px 22px;
  background: transparent;
  border: 2px solid var(--green);
  color: var(--green-deep);
  text-decoration: none; border-radius: 30px;
  font-size: 14px; font-weight: 500;
  cursor: pointer;
  font-family: 'Tajawal', sans-serif;
  transition: background .25s, transform .25s, color .25s;
}
.calendar-btn:hover { background: var(--green); color: #fffdf8; transform: translateY(-2px); }

/* Share button */
.share-btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; padding: 12px 22px;
  background: transparent;
  border: 2px solid var(--gold);
  color: var(--green-deep);
  text-decoration: none; border-radius: 30px;
  font-size: 14px; font-weight: 500;
  cursor: pointer;
  font-family: 'Tajawal', sans-serif;
  transition: background .25s, transform .25s, color .25s;
}
.share-btn:hover { background: var(--gold); color: #1a2616; transform: translateY(-2px); }

/* Share modal */
.share-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(26,38,22,0.7);
  backdrop-filter: blur(4px);
  z-index: 2000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.share-modal-overlay.show { display: flex; }

.share-modal {
  background: #fffdf8;
  border-radius: 20px;
  padding: 28px 24px;
  max-width: 340px;
  width: 100%;
  text-align: center;
  position: relative;
  border: 2px solid rgba(201,163,93,0.3);
  animation: modalIn 0.3s ease both;
}
@keyframes modalIn {
